<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>MMOM carousel</title>
<!-- Matched by eye to MMOM_LI_Carousel_v1.pdf. Lora (serif) + DM Sans (sans). -->
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,500&family=DM+Sans:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --cream: #f9f6f1;   /* slide background */
    --ink: #1c1814;     /* headlines, dark slide bg */
    --body: #7a6e62;    /* supporting lines, wordmark */
    --peach: #b8644b;   /* numbers, page count, the one accent */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ccc; }
  .slide {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background: var(--cream); color: var(--ink);
    padding: 0 88px; display: flex; flex-direction: column; justify-content: center;
    font-family: "DM Sans", sans-serif;
  }
  .slide + .slide { margin-top: 40px; }
  .mark {
    position: absolute; top: 96px; left: 88px;
    font: 500 21px/1 "DM Sans", sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: var(--body);
  }
  .mark::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--peach); margin-right: 14px; vertical-align: 3px; }
  .num { font: 600 150px/1 "Lora", serif; color: var(--peach); margin-bottom: 44px; }
  h1 { font: 600 76px/1.12 "Lora", serif; letter-spacing: -0.01em; max-width: 860px; }
  h2 { font: 600 66px/1.15 "Lora", serif; letter-spacing: -0.005em; max-width: 860px; }
  .accent { font: italic 500 44px/1.3 "Lora", serif; color: var(--peach); margin-top: 36px; }
  p { font: 400 32px/1.6 "DM Sans", sans-serif; color: var(--body); max-width: 780px; margin-top: 32px; }
  p + p { margin-top: 26px; }
  .foot { position: absolute; left: 88px; right: 88px; bottom: 96px; display: flex; justify-content: space-between; align-items: baseline; }
  .foot .left { font: 500 25px/1 "DM Sans", sans-serif; color: var(--body); }
  .foot .page { font: 600 30px/1 "Lora", serif; color: var(--peach); margin-left: auto; }

  /* Break slide: full peach, everything cream */
  .slide.peach { background: var(--peach); color: var(--cream); }
  .slide.peach .mark, .slide.peach p, .slide.peach .num, .slide.peach .page { color: var(--cream); }
  .slide.peach .mark::before { background: var(--cream); }
  /* CTA slide: near-black, cream type, peach accents */
  .slide.dark { background: var(--ink); color: var(--cream); }
  .slide.dark .mark, .slide.dark .foot .left { color: var(--cream); }
  .slide.dark p { color: var(--peach); }

  /* Render mode: ?s=N shows only slide N at 0,0 */
  body.solo { background: none; }
  body.solo .slide { display: none; margin: 0; }
  body.solo .slide.on { display: flex; }
</style>
<style>
 .q { font: italic 500 70px/1.2 "Lora", serif; max-width: 880px; }
 .q.small { font-size: 60px; }
 .by { font: 500 28px/1.4 "DM Sans", sans-serif; color: var(--body); margin-top: 48px; letter-spacing: .02em; }
 .slide.peach .by { color: var(--cream); }
 .slide.dark .by { color: var(--peach); }
 .slide.dark .q { color: var(--cream); }
 .slide.peach .foot .left { color: var(--cream); }
</style>
</head>
<body>
<section class="slide ">
  <div class="mark">Me &amp; My Old Man</div>
  <div class="q">We&rsquo;ve mostly seen the version built for us. Not the cellar&nbsp;version.</div>
  <div class="by">The Pringle pots</div>
  <div class="foot"><span class="left">meandmyoldman.co.uk</span></div>
</section>
<script>
  const s = new URLSearchParams(location.search).get("s");
  if (s) {
    document.body.classList.add("solo");
    const el = document.querySelectorAll(".slide")[+s - 1];
    if (el) el.classList.add("on");
  }
</script>
</body>
</html>
